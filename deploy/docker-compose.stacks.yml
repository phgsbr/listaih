# Listaih — imagem all-in-one (backend + PostgreSQL + Redis via supervisord)
# Colar na UI de Stacks do ZimaOS e aplicar. 1 container, 1 servico, nada mais.
services:
  listaih:
    image: ghcr.io/phgsbr/listaih:v0.1.0
    container_name: listaih
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: teste123
      JWT_SECRET: teste123
    volumes:
      - listaih_data:/var/lib/postgresql/data
    ports:
      - "3000:3000"

volumes:
  listaih_data: