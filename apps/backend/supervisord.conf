[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[program:postgres]
command=/usr/libexec/postgresql16/postgres -D /var/lib/postgresql/data -c listen_addresses=127.0.0.1 -p 5432
user=postgres
autorestart=true
stdout_logfile=/var/log/postgres.log
stderr_logfile=/var/log/postgres.err
startsecs=5
startretries=5

[program:redis]
command=redis-server --port 6379 --bind 127.0.0.1
autorestart=true
stdout_logfile=/var/log/redis.log
stderr_logfile=/var/log/redis.err
startsecs=2

[program:backend]
command=node dist/main.js
directory=/app
environment=DATABASE_URL="postgresql://listaih:%(ENV_POSTGRES_PASSWORD)s@127.0.0.1:5432/listaih?schema=public",REDIS_URL="redis://127.0.0.1:6379",JWT_SECRET="%(ENV_JWT_SECRET)s",JWT_ACCESS_EXPIRATION=15m,JWT_REFRESH_EXPIRATION=7d,PORT=3000,CORS_ORIGIN="*",NODE_ENV=production,ADMIN_DIST_PATH=/app/admin/dist
autorestart=true
stdout_logfile=/var/log/backend.log
stderr_logfile=/var/log/backend.err
startsecs=10
startretries=3