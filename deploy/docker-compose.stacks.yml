# Listaih — imagem all-in-one (backend + PostgreSQL + Redis num só container)
# Colar na UI de Stacks do ZimaOS e aplicar. Não precisa de mais nada.
services:
  listaih:
    image: ghcr.io/phgsbr/listaih:all-in-one
    container_name: listaih
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: teste123
      JWT_SECRET: teste123
    volumes:
      - listaih_data:/var/lib/postgresql/data
    ports:
      - "3000:3000"

volumes:
  listaih_data: